name: Public Leak Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # "edited" re-runs the PR text check when a title or body changes.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: leak-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Standards registers (thread positions, pending replies, sweep reports) are
# built from private mail and live in cred-ninja/standards-private. These
# markers are what that content looks like: Gmail message, thread and draft
# ids, off-list replies, and register stances. Same rules as cred-ninja/sdk.
jobs:
  leak-guard:
    name: Block Private Correspondence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_MARKERS: 'Gmail (draft|drafts|thread|message|messages|id|ids|evidence|checked|delay|HOLD)\b|[Pp]rivate Gmail\b|Gmail r-?[0-9]{10,}|Gmail[^|)]{0,40}\b[0-9a-f]{16}\b|\b[Oo]ff-list\b|\b[Pp]rivately\b|Stance: (SPEAK|WATCH|DROP)\b|\b[Ss]peak[- ]by\b|/Users/kieran/'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Block register paths
        shell: bash
        run: bash scripts/ci/public-leak-guard.sh files

      - name: Block private correspondence markers in PR text and commits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/public-leak-guard.sh pr
