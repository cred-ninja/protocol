name: conformance / draft-asor vectors

permissions:
  contents: read

concurrency:
  group: asor-vectors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'conformance/asor-delegation-chain/**'
      - '.github/workflows/conformance-asor-vectors.yml'
  pull_request:
    paths:
      - 'conformance/asor-delegation-chain/**'
      - '.github/workflows/conformance-asor-vectors.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: cred-ninja/sdk ref to run the vectors against (default main)
        required: false
        default: main

jobs:
  vectors:
    name: vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: protocol
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: cred-ninja/sdk
          ref: ${{ github.event.inputs.sdk_ref || 'main' }}
          path: sdk
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install sdk dependencies
        working-directory: sdk
        run: npm ci
      # The vault entry the runner imports resolves its workspace deps
      # (@credninja/protocol, @credninja/attenuation, @credninja/oauth)
      # through their built dist/; npm ci alone leaves them unbuilt.
      - name: Build sdk packages the vault imports
        working-directory: sdk
        run: |
          npm run build --workspace=packages/protocol
          npm run build --workspace=packages/attenuation
          npm run build --workspace=packages/oauth
      - name: Install runner deps
        working-directory: protocol/conformance/asor-delegation-chain
        run: npm ci --no-audit --no-fund
      - name: Record sdk commit under test
        working-directory: sdk
        run: |
          echo "SDK_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "sdk commit: $(git rev-parse HEAD)"
      - name: Run vectors against sdk
        working-directory: protocol/conformance/asor-delegation-chain
        # --allow-gaps covers the two JSON canonicalization GAPs
        # (duplicate_member, unsafe_integer). The ceiling GAP closed with
        # sdk e92af19; see conformance/asor-delegation-chain/README.md.
        run: |
          npx tsx run.ts --sdk "$GITHUB_WORKSPACE/sdk" --allow-gaps
          npx tsx run.ts --sdk "$GITHUB_WORKSPACE/sdk" --allow-gaps --json > "run-sdk-${SDK_SHA}.json"
      - name: Retain run output (sdk commit in the file name)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asor-vectors-sdk-${{ env.SDK_SHA }}
          path: protocol/conformance/asor-delegation-chain/run-sdk-*.json
          retention-days: 400
